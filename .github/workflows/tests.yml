name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      ANT_VERSION: 1.10.15
      JUNIT_VERSION: 4.13.2
      HAMCREST_VERSION: 1.3

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Ant and JUnit come from Maven Central so the build doesn't depend on
      # whatever the runner image has installed. JUnit and Hamcrest stand in
      # for the libraries NetBeans normally supplies.
      - name: Download Ant and JUnit
        run: |
          repo=https://repo1.maven.org/maven2
          mkdir -p "$RUNNER_TEMP/ant/lib" "$RUNNER_TEMP/libs"
          for jar in ant ant-launcher ant-junit ant-junit4; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ant/lib/$jar.jar" \
              "$repo/org/apache/ant/$jar/$ANT_VERSION/$jar-$ANT_VERSION.jar"
          done
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/libs/junit.jar" \
            "$repo/junit/junit/$JUNIT_VERSION/junit-$JUNIT_VERSION.jar"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/libs/hamcrest.jar" \
            "$repo/org/hamcrest/hamcrest-core/$HAMCREST_VERSION/hamcrest-core-$HAMCREST_VERSION.jar"

      - name: Build and run tests
        run: |
          java -Dant.home="$RUNNER_TEMP/ant" \
            -cp "$RUNNER_TEMP/ant/lib/ant-launcher.jar" \
            org.apache.tools.ant.launch.Launcher \
            -Dlibs.junit_4.classpath="$RUNNER_TEMP/libs/junit.jar" \
            -Dlibs.hamcrest.classpath="$RUNNER_TEMP/libs/hamcrest.jar" \
            clean jar test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test/results/
