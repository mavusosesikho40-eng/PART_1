name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Android app and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signs the app with the same key every time, so updates install over
      # the old version and keep your data. Skipped if the secrets aren't set.
      - name: Get the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the app is signed with a throwaway debug key and won't install over an earlier version. See mobile/README.md."
          fi

      # The runner comes with the Android SDK, so this builds the real app.
      - name: Run the shared tests and build the app
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-configuration-cache :composeApp:testDebugUnitTest :composeApp:assembleDebug

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: subscription-tracker-android
          path: mobile/composeApp/build/outputs/apk/debug/composeApp-debug.apk

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: mobile/composeApp/build/reports/tests/

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the app on an Android emulator and takes a picture of each screen.
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          script: ./scripts/screenshots.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: mobile/build/screenshots/

  ios:
    name: iPhone app and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the shared tests on the iPhone simulator
        run: ./gradlew --no-configuration-cache :composeApp:iosSimulatorArm64Test

      # Builds the Xcode project the way Xcode does, without signing.
      - name: Build the iPhone app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
