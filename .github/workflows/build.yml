name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The runner comes with the Android SDK, so this builds the real app.
      - name: Run the shared tests and build the app
        run: ./gradlew --no-configuration-cache :composeApp:testDebugUnitTest :composeApp:assembleDebug

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: composeApp/build/reports/tests/

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the app on an Android emulator and takes a picture of each
      # screen, in light and dark mode, and of the reminder notifications.
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./scripts/screenshots.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: build/screenshots/

  ios:
    name: iPhone app and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the shared tests on the iPhone simulator
        run: ./gradlew --no-configuration-cache :composeApp:iosSimulatorArm64Test

      # Builds the Xcode project the way Xcode does, without signing.
      - name: Build the iPhone app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

  desktop:
    name: Desktop app and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Also draws every screen at a desktop window's size and a phone's.
      - name: Run the shared tests and draw the screens
        run: ./gradlew --no-configuration-cache :composeApp:desktopTest

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: composeApp/build/desktop-screenshots/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: composeApp/build/reports/tests/

  # ---- Releases: built on every push, published for pushes to master as v1.0.<run number> ----

  release-android:
    name: Signed Android app
    if: github.event_name != 'pull_request'
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signs the app with the same key every time, so each release installs
      # over the previous one and keeps your data.
      - name: Build the signed app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the release has no Android app. See README.md, 'Updates that keep your data'."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/signing.jks"
          ./gradlew --no-configuration-cache :composeApp:assembleRelease
          mkdir -p release
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "release/SubscriptionTracker-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/
          if-no-files-found: ignore

  release-windows:
    name: Windows installer
    if: github.event_name != 'pull_request'
    needs: [android, ios, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the installer
        shell: bash
        run: |
          ./gradlew --no-configuration-cache :composeApp:packageMsi
          mkdir -p release
          cp composeApp/build/compose/binaries/main/msi/*.msi "release/SubscriptionTracker-1.0.${{ github.run_number }}.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/

  release:
    name: Publish the release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Subscription Tracker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            - **Android:** on your phone, tap the `.apk` below and install it. It updates the app you have and keeps your data.
            - **Windows:** download the `.msi` and run it. Your data is kept in the SubscriptionTracker folder in your user folder.
            - **iPhone:** build it from `iosApp/` in Xcode on a Mac (see the README).
          files: release/*
